[project]
name = "calendario-coop"
version = "0.1.0"
description = "Calendário compartilhado de disponibilidade"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "typer>=0.15,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
